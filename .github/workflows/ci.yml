name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run verify:package
      - run: npm pack --dry-run
      # Fails when the published Backwork OpenAPI document no longer accepts a
      # request field or declares a response field this server uses, when a tool
      # action is offered for an operation production does not serve, or when
      # the vendored openapi/backwork-openapi.json no longer matches it.
      - run: npm run contract:live
